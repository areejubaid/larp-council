# Root Render Blueprint for the Brain and the Hub. Free web services only.
# The Voice Studio (part_a_voice) is not listed: it needs the ElevenLabs key and is run by the team.
# Render names the public URLs after the service names (for example https://larp-council-brain.onrender.com).
services:
  - type: web
    name: larp-council-brain
    runtime: python
    plan: free
    rootDir: part-b-brain
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      # Optional. Without it the Brain uses its offline scripts.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Do NOT set EVENT_HUB_URL here. The hub already publishes every event from the /run reply.

  - type: web
    name: mind-council-hub
    runtime: node
    plan: free
    rootDir: part-c-experience
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: REPLAY_SPEED
        value: "1"
      # Team to set after the first deploy: the Brain's public URL ending in /run,
      # for example https://larp-council-brain.onrender.com/run
      - key: BRAIN_URL
        sync: false
      # Team to set: public https origin of the Voice Studio, no trailing slash. Unset means text only.
      - key: VOICE_URL
        sync: false
